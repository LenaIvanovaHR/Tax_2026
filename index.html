<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Налоговые вычеты — учебный модуль • «Теплолюкс»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1e21; --ink2:#26292d; --ink3:#33373c;
  --grey:#d6d6d2; --grey2:#9a9c9e;
  --beige:#ece3d3; --beige2:#f6f1e7;
  --terra:#d95d39; --terra2:#b8472a;
  --ok:#5f8f6b; --bad:#c2453a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--ink);color:var(--beige);-webkit-font-smoothing:antialiased;line-height:1.5}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}

/* Sidebar */
aside{background:var(--ink2);border-right:1px solid var(--ink3);padding:28px 24px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px}
.logo{background:var(--terra);color:#fff;font-weight:800;font-size:13px;letter-spacing:.14em;padding:8px 12px;border-radius:6px}
.brand small{color:var(--grey2);font-size:12px;line-height:1.3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--ink);border:1px solid var(--ink3);border-radius:12px;padding:12px 14px}
.stat.wide{grid-column:span 2}
.stat span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey2)}
.stat b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.wide b{color:var(--terra);font-size:26px}
.steps{list-style:none;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.steps li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--grey2);transition:.2s}
.steps li i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.steps li.cur{background:var(--ink);color:var(--beige)}
.steps li.cur i{border-color:var(--terra);color:var(--terra)}
.steps li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.bad i{background:var(--bad);border-color:var(--bad);color:#fff}
.steps li.ok,.steps li.bad{color:var(--grey)}

/* Main */
main{padding:clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;max-width:920px;width:100%;margin:0 auto}
.bar{height:3px;background:var(--ink3);border-radius:3px;overflow:hidden;margin-bottom:32px}
.bar div{height:100%;background:var(--terra);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.kicker{display:flex;gap:10px;align-items:center;color:var(--terra);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.kicker em{font-style:normal;color:var(--grey2);font-weight:500;letter-spacing:.04em;text-transform:none}
h1{font-size:clamp(26px,3.4vw,40px);line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-bottom:22px}
.theory{background:var(--beige);color:var(--ink);border-radius:16px;padding:20px 24px;margin-bottom:22px;position:relative}
.theory::before{content:"ТЕОРИЯ";position:absolute;top:-9px;left:20px;background:var(--terra);color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;padding:3px 10px;border-radius:4px}
.theory ul{list-style:none;display:grid;gap:8px;margin-top:4px}
.theory li{font-size:14.5px;padding-left:18px;position:relative}
.theory li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;background:var(--terra);border-radius:2px}
.q{font-size:clamp(17px,2vw,20px);font-weight:600;margin-bottom:16px;color:#fff}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--ink2);border:1.5px solid var(--ink3);color:var(--beige);border-radius:14px;padding:15px 18px;font:inherit;font-size:15px;cursor:pointer;transition:.18s}
.opt kbd{font:inherit;font-size:12px;font-weight:700;color:var(--grey2);border:1.5px solid var(--ink3);border-radius:7px;width:28px;height:28px;display:grid;place-items:center;flex:none;transition:.18s}
.opt:hover:not(:disabled){border-color:var(--terra);transform:translateX(4px)}
.opt:hover:not(:disabled) kbd{border-color:var(--terra);color:var(--terra)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(95,143,107,.14)}
.opt.right kbd{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:rgba(194,69,58,.14)}
.opt.wrong kbd{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.4}

.debrief{margin-top:20px;border:1.5px solid var(--ink3);border-radius:16px;overflow:hidden;animation:up .35s ease}
.debrief .head{padding:12px 20px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.debrief.ok .head{background:var(--ok);color:#fff}
.debrief.bad .head{background:var(--bad);color:#fff}
.debrief .body{padding:18px 20px;display:grid;gap:12px;background:var(--ink2)}
.debrief p{font-size:14.5px;color:var(--grey)}
.calc{font-variant-numeric:tabular-nums;background:var(--ink);border-left:3px solid var(--terra);padding:11px 14px;border-radius:0 10px 10px 0;font-size:14px;color:var(--beige)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.gain{font-size:13px;color:var(--grey2)}.gain b{color:var(--terra);font-size:17px}
.btn{background:var(--terra);color:#fff;border:0;border-radius:12px;padding:13px 26px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:.18s}
.btn:hover{background:var(--terra2);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink3);color:var(--beige)}
.btn.ghost:hover{border-color:var(--terra);background:transparent}
.note{margin-top:28px;font-size:11.5px;color:var(--grey2)}

/* Intro / Final */
.big{font-size:clamp(46px,8vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--terra);font-variant-numeric:tabular-nums}
.lead{font-size:17px;color:var(--grey);max-width:620px;margin-bottom:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.grid3 div{background:var(--ink2);border:1px solid var(--ink3);border-radius:14px;padding:16px}
.grid3 b{display:block;font-size:26px;color:var(--terra)}
.grid3 span{font-size:12.5px;color:var(--grey2)}
.recap{display:grid;gap:6px;margin:18px 0 26px}
.recap div{display:flex;justify-content:space-between;gap:12px;background:var(--ink2);border-radius:10px;padding:10px 14px;font-size:13.5px}
.recap .y{border-left:3px solid var(--ok)}.recap .n{border-left:3px solid var(--bad)}
.fade{animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:16px 20px;gap:14px}
  .steps{display:none}
  .stats{grid-template-columns:repeat(3,1fr);flex:1;min-width:260px}
  .stat.wide{grid-column:auto}.stat b,.stat.wide b{font-size:17px}
  .grid3{grid-template-columns:1fr}
}

/* ===== Заставка ===== */
.splash{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:clamp(24px,4vw,48px);align-items:center}
.vbox{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--ink3);background:var(--ink2);aspect-ratio:9/16;max-height:min(70vh,560px);width:100%;box-shadow:0 24px 60px -24px rgba(0,0,0,.7)}
.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.vbox::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(28,30,33,.55),transparent 35%);pointer-events:none}
.snd{position:absolute;right:12px;bottom:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(28,30,33,.6);backdrop-filter:blur(6px);color:var(--beige);display:grid;place-items:center;cursor:pointer;transition:.18s}
.snd:hover{background:var(--terra);border-color:var(--terra)}
.snd svg{width:20px;height:20px}
.vcap{position:absolute;left:14px;bottom:18px;z-index:2;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--beige)}
.agenda{list-style:none;display:grid;gap:10px;margin:0 0 22px}
.agenda li{display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--grey)}
.agenda li i{font-style:normal;flex:none;width:26px;height:26px;border-radius:8px;background:var(--ink2);border:1px solid var(--ink3);color:var(--terra);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chips span{font-size:12px;color:var(--grey2);border:1px solid var(--ink3);border-radius:20px;padding:5px 12px}
.rule{margin-top:18px;font-size:12.5px;color:var(--grey2);border-left:3px solid var(--terra);padding:2px 0 2px 12px;max-width:560px}

/* ===== Навигация ===== */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-12px 0 22px}
.nav .btn{padding:8px 16px;font-size:13px;border-radius:10px}
.nav .btn:disabled{opacity:.35;cursor:default;transform:none;border-color:var(--ink3)}
.nav small{font-size:12px;color:var(--grey2)}
.steps li.link{cursor:pointer}
.steps li.link:hover{background:var(--ink);color:var(--beige)}
.steps li.lock{opacity:.4}
.steps li.fin{margin-top:8px;border-top:1px solid var(--ink3);border-radius:0 0 8px 8px;padding-top:14px}
.steps li.fin i{border-radius:8px}
.foot .acts{display:flex;gap:10px;flex-wrap:wrap}
.recap div.go{cursor:pointer;transition:.15s}
.recap div.go:hover{background:var(--ink3)}
.recap em{font-style:normal;color:var(--grey2);font-size:12px}
.status{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:8px;margin-bottom:16px}
.status.ok{background:var(--ok);color:#fff}
.status.todo{background:rgba(217,93,57,.16);color:var(--terra);border:1px solid var(--terra)}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 8px}
.meter div{background:var(--ink2);border:1px solid var(--ink3);border-radius:14px;padding:14px 16px}
.meter b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.meter span{font-size:12px;color:var(--grey2)}
@media(max-width:900px){
  .splash{grid-template-columns:1fr}
  .vbox{max-height:46vh;max-width:260px;margin:0 auto}
  .meter{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">ТЕПЛОЛЮКС</div><small>Корпоративное обучение<br>Финансовая грамотность</small></div>
    <div class="stats">
      <div class="stat wide"><span>Выявлено выгоды</span><b id="sGain">0 ₽</b></div>
      <div class="stat"><span>Верно</span><b id="sOk">0</b></div>
      <div class="stat"><span>Серия</span><b id="sStreak">0</b></div>
    </div>
    <ol class="steps" id="steps"></ol>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============ КОНТЕНТ ============ */
const CASES = [
 {tag:"Основы", title:"Как работает вычет",
  theory:["Вычет уменьшает налоговую базу, а не выплачивается «деньгами».","Возвращается 13% от суммы расходов (в пределах лимита) — и не больше, чем вы заплатили налога за год."],
  q:"На лечение вы потратили 150 000 ₽. Сколько денег вернётся на счёт?",
  opts:["150 000 ₽","19 500 ₽","13 000 ₽"], ok:1, gain:19500,
  calc:"150 000 ₽ × 13% = 19 500 ₽",
  why:"Вычет — это база для расчёта. На счёт возвращается только 13% от неё."},

 {tag:"НДФЛ", title:"Прогрессивная шкала",
  theory:["С 2025 года шкала НДФЛ: 13% до 2,4 млн ₽; 15% — 2,4–5 млн; 18% — 5–20 млн; 20% — 20–50 млн; 22% — свыше 50 млн ₽.","Повышенная ставка применяется только к части дохода сверх порога."],
  q:"Годовой доход сотрудника — 3 000 000 ₽. Сколько составит НДФЛ?",
  opts:["390 000 ₽ (13% со всей суммы)","402 000 ₽","450 000 ₽ (15% со всей суммы)"], ok:1, gain:0,
  calc:"2 400 000 × 13% + 600 000 × 15% = 312 000 + 90 000 = 402 000 ₽",
  why:"Ставка 15% применяется только к «хвосту» дохода выше 2,4 млн ₽."},

 {tag:"Сроки", title:"Трёхлетнее окно",
  theory:["Вернуть налог можно за последние 3 года, предшествующие году подачи декларации.","Подать 3-НДФЛ можно в любое время года, если вычет заявляется за прошедшие периоды."],
  q:"В 2026 году вы узнали о вычете за обучение, оплаченное в 2022 году. Можно ли его получить?",
  opts:["Да, срока давности нет","Нет — за 2022 год уже поздно, вернуть можно за 2023–2025 гг.","Только через суд"], ok:1, gain:0,
  calc:"Подача в 2026 г. → охват периодов: 2023, 2024, 2025",
  why:"Расходы 2022 года вне трёхлетнего периода. Поэтому вычетами лучше заниматься каждый год, не откладывая."},

 {tag:"Недвижимость", title:"Покупка квартиры семьёй",
  theory:["Имущественный вычет: база до 2 000 000 ₽ — возврат до 260 000 ₽ на человека.","Вычет по ипотечным процентам: база до 3 000 000 ₽ — до 390 000 ₽ на человека.","Супруги-собственники используют лимиты каждый отдельно."],
  q:"Квартира за 6 млн ₽ куплена в ипотеку, оба супруга — собственники и налогоплательщики. Какой максимум возврата за саму покупку (без процентов)?",
  opts:["260 000 ₽ — лимит один на семью","520 000 ₽","780 000 ₽"], ok:1, gain:520000,
  calc:"2 × (2 000 000 ₽ × 13%) = 2 × 260 000 = 520 000 ₽",
  why:"Лимит 2 млн ₽ применяется к каждому собственнику. Ещё до 780 000 ₽ семья вернёт по процентам ипотеки (2 × 390 000 ₽)."},

 {tag:"Лимиты", title:"Социальные вычеты: корзины",
  theory:["Общий лимит на себя (обучение, лечение, фитнес и др.) — 150 000 ₽ в год.","Обучение детей — отдельный лимит 110 000 ₽ на каждого ребёнка."],
  q:"За год: своё обучение 40 000 ₽, фитнес 90 000 ₽, обучение сына 80 000 ₽. Сколько вернут?",
  opts:["19 500 ₽ — всё в один лимит 150 000 ₽","16 900 ₽ — только траты на себя","27 300 ₽"], ok:2, gain:27300,
  calc:"(40 000 + 90 000) + 80 000 = 210 000 ₽ × 13% = 27 300 ₽",
  why:"Траты на себя (130 000 ₽) укладываются в лимит 150 000 ₽, а обучение сына (80 000 ₽) — в отдельную «корзину» 110 000 ₽."},

 {tag:"Лечение", title:"Дорогостоящее лечение",
  theory:["Расходы на виды лечения из специального перечня Правительства не входят в лимит 150 000 ₽.","Возврат считается с фактической суммы (код услуги в справке — «2»)."],
  q:"Операция из перечня дорогостоящих обошлась в 400 000 ₽. Сколько можно вернуть?",
  opts:["19 500 ₽ — не больше лимита","52 000 ₽","Ничего, лечение платное"], ok:1, gain:52000,
  calc:"400 000 ₽ × 13% = 52 000 ₽",
  why:"Дорогостоящее лечение вычитается без ограничения лимитом — важно получить справку об оплате медуслуг с правильным кодом."},

 {tag:"Ограничения", title:"Возврат ≤ уплаченного налога",
  theory:["Нельзя вернуть больше НДФЛ, чем удержано за год.","Неиспользованный остаток имущественного вычета переносится на следующие годы."],
  q:"Вычет на покупку жилья даёт право на 260 000 ₽, но за год удержано НДФЛ 80 000 ₽. Что произойдёт?",
  opts:["Вернут 260 000 ₽ сразу","Вернут 80 000 ₽, остаток перенесётся на следующие годы","Вычет сгорит"], ok:1, gain:80000,
  calc:"min(260 000; 80 000) = 80 000 ₽ · остаток 180 000 ₽ → в следующие годы",
  why:"Имущественный вычет не сгорает: он используется частями, пока лимит не будет выбран полностью."},

 {tag:"Семья", title:"Стандартный вычет на детей",
  theory:["С 2025 года: 1 400 ₽/мес. на 1-го, 2 800 ₽/мес. на 2-го ребёнка, 6 000 ₽ — на 3-го и каждого следующего.","Действует, пока доход с начала года не превысит 450 000 ₽. Дети до 18 лет и студенты очной формы до 24 лет.","Оформляется заявлением у работодателя."],
  q:"Двое детей, зарплата 30 000 ₽/мес. Как оформить и сколько это даст за год?",
  opts:["Через работодателя, ≈ 6 552 ₽ в год","Только декларацией в конце года, 2 800 ₽","Автоматически, без заявления, 36 400 ₽"], ok:0, gain:6552,
  calc:"(1 400 + 2 800) × 13% = 546 ₽/мес. × 12 = 6 552 ₽ · доход за год 360 000 ₽ < 450 000 ₽",
  why:"Достаточно заявления и документов в отдел персонала - деньги приходят в зарплате уже в текущем году."},

 {tag:"Самостоятельно", title:"Доход без налогового агента",
  theory:["С зарплаты налог удерживает работодатель — налоговый агент.","С дохода, по которому агента нет (аренда от физлица, продажа имущества и др.), налог декларирует сам гражданин."],
  q:"Вы сдаёте квартиру, арендатор платит на карту напрямую. Что делать?",
  opts:["Ничего — налог с зарплаты уже удержан","Подать 3-НДФЛ до 30 апреля следующего года и уплатить налог до 15 июля","Уведомить работодателя"], ok:1, gain:0,
  calc:"Декларация — до 30.04, уплата — до 15.07 года, следующего за отчётным",
  why:"Зарплата и аренда — разные источники. Неуплата влечёт штраф и пени. Альтернатива — режим самозанятого."},

 {tag:"Здоровье", title:"ГТО + диспансеризация",
  theory:["Новый вычет: 18 000 ₽ базы при выполнении нормативов ГТО и прохождении диспансеризации.","Оба события должны произойти в одном календарном году. Условия уточняйте в актуальной редакции НК РФ."],
  q:"ГТО сдано в марте 2026 г., диспансеризация пройдена в декабре 2025 г. Есть ли право на вычет?",
  opts:["Да, оба события выполнены","Нет — события в разных годах","Да, но только 50%"], ok:1, gain:0,
  calc:"Если оба события в одном году: 18 000 ₽ × 13% = 2 340 ₽",
  why:"Пройдите диспансеризацию в 2026 году — тогда вычет 2 340 ₽ будет доступен."}
];


/* ============ СОСТОЯНИЕ ============ */
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
const N = CASES.length;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let S;
/* q[k]: order — порядок вариантов на экране; picked — выбранный вариант (или null);
   ok — верно ли сейчас; first — верно ли с первой попытки; tries — число попыток */
function fresh(){
  return { i:-1, hi:-1, fixing:false, log:[],
    q: CASES.map(c => ({order:shuffle(c.opts.map((t,k)=>k)), picked:null, ok:null, first:null, tries:0})) };
}

const answeredAll = () => S.q.every(x => x.picked !== null);
const nOk    = () => S.q.filter(x => x.ok === true).length;
const nFirst = () => S.q.filter(x => x.first === true).length;
const wrongs = () => S.q.map((x,k)=>x.ok===false?k:-1).filter(k=>k>=0);
const gain   = () => CASES.reduce((s,c,k)=>s+(S.q[k].ok?c.gain:0),0);
function streaks(){
  let cur=0,best=0;
  S.log.forEach(v=>{ cur = v ? cur+1 : 0; best = Math.max(best,cur); });
  return {cur,best};
}
const canOpen = k => k <= S.hi + 1;

/* ============ БОКОВАЯ ПАНЕЛЬ ============ */
function renderSide(){
  const st = streaks();
  $('sGain').textContent = fmt(gain());
  $('sOk').textContent = nOk() + '/' + N;
  $('sStreak').textContent = st.cur;
  const items = CASES.map((c,k)=>{
    const x = S.q[k];
    let cls = x.ok===true?'ok':x.ok===false?'bad':'';
    if (k===S.i) cls += ' cur';
    cls += canOpen(k) ? ' link' : ' lock';
    const mark = x.ok===true?'✓':x.ok===false?'✕':(k+1);
    return `<li class="${cls}" ${canOpen(k)?`onclick="openQ(${k})"`:''}><i>${mark}</i>${c.title}</li>`;
  }).join('');
  const fin = answeredAll();
  $('steps').innerHTML = items +
    `<li class="fin ${S.i>=N?'cur':''} ${fin?'link':'lock'}" ${fin?'onclick="final()"':''}><i>★</i>Итоги</li>`;
}

/* ============ ВОПРОС ============ */
function openQ(k){
  if (k<0 || k>=N || !canOpen(k)) return;
  S.i = k;
  const c = CASES[k], x = S.q[k], done = x.picked !== null;
  renderSide();
  $('main').innerHTML = `<div class="fade">
    <div class="bar"><div id="pb"></div></div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${k===0?'disabled':''} onclick="openQ(${k-1})">← Назад</button>
      <small>${S.fixing?'Исправление ошибок · ':''}Вопрос ${k+1} из ${N}</small>
    </div>
    <div class="kicker">${c.tag} <em>· кейс ${k+1} из ${N}</em></div>
    <h1>${c.title}</h1>
    <div class="theory"><ul>${c.theory.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <p class="q">${c.q}</p>
    <div class="opts" id="opts">${x.order.map((o,n)=>`<button class="opt" data-k="${o}"><kbd>${n+1}</kbd><span>${c.opts[o]}</span></button>`).join('')}</div>
    <div id="deb"></div>
  </div>`;
  requestAnimationFrame(()=>{ const pb=$('pb'); if(pb) pb.style.width = (k/N*100)+'%'; });
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if (done) showResult(false);
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(pick){
  const k = S.i, x = S.q[k], c = CASES[k];
  if (x.picked !== null) return;
  x.picked = pick; x.tries++;
  x.ok = (pick === c.ok);
  if (x.first === null){ x.first = x.ok; S.log.push(x.ok); }
  S.hi = Math.max(S.hi, k);
  renderSide();
  showResult(true);
}

function showResult(scroll){
  const k = S.i, x = S.q[k], c = CASES[k], good = x.ok;
  document.querySelectorAll('.opt').forEach(b=>{
    const bk = +b.dataset.k; b.disabled = true;
    if (bk===c.ok) b.classList.add('right');
    else if (bk===x.picked) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = k === N-1;
  const left = wrongs().filter(w=>w!==k);
  let primary;
  if (S.fixing && good) primary = left.length
      ? `<button class="btn" onclick="nextFix()">Следующая ошибка →</button>`
      : `<button class="btn" onclick="final()">К итогам →</button>`;
  else if (!good) primary = `<button class="btn" onclick="retry()">Ответить ещё раз</button>`;
  else primary = `<button class="btn" onclick="${last?'final()':'openQ('+(k+1)+')'}">${last?'Показать итоги':'Дальше →'}</button>`;
  const secondary = (!good && !S.fixing) ? `<button class="btn ghost" onclick="${last?'final()':'openQ('+(k+1)+')'}">${last?'К итогам':'Пропустить дальше'}</button>` : '';
  const gainTxt = good && c.gain ? `Ваша выгода в кейсе: <b>+${fmt(c.gain)}</b>`
                : good ? 'Отличное понимание правила'
                : 'Прочитайте разбор и ответьте ещё раз — курс засчитывается при верных ответах на все вопросы';
  $('deb').innerHTML = `<div class="debrief ${good?'ok':'bad'}">
    <div class="head">${good?'Верно':'Неверно — разберём'}</div>
    <div class="body">
      <p>${c.why}</p>
      <div class="calc">${c.calc}</div>
      <div class="foot">
        <div class="gain">${gainTxt}</div>
        <div class="acts">${secondary}${primary}</div>
      </div>
    </div></div>`;
  if (scroll) $('deb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function retry(){
  const k = S.i, x = S.q[k];
  x.picked = null; x.ok = null;
  x.order = shuffle(CASES[k].opts.map((t,i)=>i));
  openQ(k);
}

function nextFix(){
  const w = wrongs();
  if (!w.length) return final();
  const k = w.find(i=>i>S.i) ?? w[0];
  S.i = k; retry();
}

function startFix(){
  S.fixing = true;
  const w = wrongs();
  if (!w.length) return final();
  S.i = w[0]; retry();
}

/* ============ ИТОГИ ============ */
function final(){
  if (!answeredAll()) { const k = S.q.findIndex(x=>x.picked===null); return openQ(k); }
  S.i = N; S.fixing = false; renderSide();
  const w = wrongs(), done = w.length === 0;
  const p1 = Math.round(nFirst()/N*100);
  const lvl = p1>=90?'Эксперт по вычетам':p1>=70?'Уверенный уровень':p1>=50?'Базовый уровень':'Есть что повторить';
  const meter = `<div class="meter">
      <div><b>${nFirst()} из ${N}</b><span>верно с первой попытки (${p1}%)</span></div>
      <div><b>${nOk()} из ${N}</b><span>верно сейчас</span></div>
      <div><b>${streaks().best}</b><span>лучшая серия подряд</span></div>
    </div>`;
  const recap = `<div class="recap">${CASES.map((c,k)=>{const x=S.q[k];return `<div class="go ${x.ok?'y':'n'}" onclick="openQ(${k})"><span>${k+1}. ${c.title}</span><span>${x.ok?(x.tries>1?'<em>со '+x.tries+'-й попытки</em> ✓':'✓ верно'):'✕ исправить'}</span></div>`}).join('')}</div>`;
  const restart = `<button class="btn ghost" onclick="if(confirm('Начать курс заново? Текущий прогресс сбросится.'))intro()">Пройти заново</button>`;
  const note = `<p class="note">Чтобы оформить вычет: обратитесь в отдел персонала (стандартные вычеты — документы подаются один раз на весь период работы у работодателя) или подайте 3-НДФЛ через личный кабинет налогоплательщика на nalog.gov.ru.</p>`;

    $('main').innerHTML = `<div class="fade">

      <div class="big">${nOk()} / ${N}</div>
      <p class="lead" style="margin-top:10px">Верных ответов на данный момент. Чтобы завершить курс, вернитесь к вопросам с ошибками и ответьте на них верно.</p>
      ${meter}${recap}
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn" onclick="startFix()">Исправить ошибки (${w.length})</button>
        ${restart}

    ${recap}

  const v = $('vid'), btn = $('snd');
  v.addEventListener('error', () => { btn.style.display='none'; }, true);
  const pr = v.play(); if (pr && pr.catch) pr.catch(()=>{});
  btn.onclick = () => { v.muted = !v.muted; btn.innerHTML = v.muted ? ICON_OFF : ICON_ON; if(!v.muted) v.play().catch(()=>{}); };
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ КЛАВИАТУРА ============ */
document.addEventListener('keydown', e=>{
  if (!S || S.i<0 || S.i>=N) return;
  const x = S.q[S.i];
  const n = parseInt(e.key,10);
  if (x.picked===null && n>=1 && n<=x.order.length) answer(x.order[n-1]);
  else if (e.key==='ArrowLeft') openQ(S.i-1);
  else if (e.key==='ArrowRight' || e.key==='Enter'){
    if (x.picked!==null){ const b = document.querySelector('#deb .btn:last-child'); if (b) b.click(); }
  }
});

intro();

</script>
